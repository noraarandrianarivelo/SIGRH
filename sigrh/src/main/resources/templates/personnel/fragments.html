<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

    <body>

        <!-- Alias historique : toutes les pages utilisent désormais la navigation commune. -->
        <th:block th:fragment="nav">
            <th:block th:replace="~{layout/shell :: navigation}">
            </th:block>
        </th:block>

        <!-- Confirmation affichée après une opération réussie. -->
        <p th:fragment="succes" th:if="${succes}" class="success-message" role="status" th:text="${succes}">
        </p>
    </body>
</html>

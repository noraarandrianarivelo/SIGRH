spring.application.name=sigrh
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/sigrh
spring.datasource.username=postgres
spring.datasource.password=postgres67
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
# Bloc 1 : contrôle Finance activé (true) ou désactivé (false) pour les nouvelles demandes
sigrh.validation-finance=true
sigrh.candidature.upload-dir=uploads/candidatures
sigrh.contrat.upload-dir=${SIGRH_CONTRAT_UPLOAD_DIR:uploads/contrats}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
